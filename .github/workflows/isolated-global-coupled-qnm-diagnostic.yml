name: Isolated global coupled QNM diagnostic

on:
  push:
    branches:
      - qnm-global-final-20261002
  workflow_dispatch:

jobs:
  global-qnm-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Rebuild complete outer H+SVT direct 41
        run: python tools/build_outer_complete41_current.py
      - name: Execute global QNM diagnostic
        run: python tools/run_global_coupled_qnm_diagnostic.py
      - name: Verify
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/generated/qnm_global_diagnostic/GLOBAL_QNM_DIAGNOSTIC_REPORT.json")
          assert p.exists()
          d=json.loads(p.read_text())
          out={
            "status":d["status"],
            "physical_qnm_claim_allowed":d["physical_qnm_claim_allowed"],
          }
          if "full_health_pass" in d:
              out["full_health_pass"]=d["full_health_pass"]
          if "spectra" in d:
              out["spectra"]={k:{
                "stable":v["stable_root_count"],
                "growing":v["stable_growing_count"],
                "damped":v["stable_damped_count"]
              } for k,v in d["spectra"].items()}
          if "pivot_gate" in d:
              out["pivot_gate"]=d["pivot_gate"]
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-global-coupled-qnm-diagnostic
          path: |
            data/generated/qnm_global_diagnostic/GLOBAL_QNM_DIAGNOSTIC_REPORT.json
            data/generated/qnm_global_diagnostic/GLOBAL_REGIONAL_REFERENCE_41.csv
            data/generated/qnm_global_diagnostic/OUTER_COMPLETE_H_SVT_41.csv
            data/generated/qnm_global_diagnostic/OUTER_COMPLETE_H_SVT_41_AUDIT.json
