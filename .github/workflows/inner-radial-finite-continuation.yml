name: Inner radial finite continuation

on:
  workflow_dispatch:
  push:
    branches:
      - spectroscopy-finalization-20260930
    paths:
      - tools/run_inner_radial_finite_continuation.py
      - .github/workflows/inner-radial-finite-continuation.yml

jobs:
  inner-finite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: pip}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/run_inner_radial_finite_continuation.py
      - uses: actions/upload-artifact@v4
        with:
          name: inner-radial-finite-continuation
          path: data/generated/spectral/INNER_RADIAL_FINITE_CONTINUATION_TRIAL.json
