name: Spectroscopy L1000 robustness

on:
  workflow_dispatch:
  push:
    branches:
      - current-member-full-domain-audit-20260930

jobs:
  robustness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/run_spectroscopy_l1000_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: spectroscopy-l1000-robustness
          path: data/generated/spectral/SPECTROSCOPY_L1000_ROBUSTNESS.json
