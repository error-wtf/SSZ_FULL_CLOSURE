name: Core quartic projected controllability

on:
  push:
    branches:
      - qnm-global-final-20261002
  workflow_dispatch:

jobs:
  core-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/audit_core_quartic_projected_controllability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-quartic-projected-controllability
          path: data/generated/qnm_global_diagnostic/CORE_QUARTIC_PROJECTED_CONTROLLABILITY.json
