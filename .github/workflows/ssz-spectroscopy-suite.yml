name: SSZ spectroscopy suite

on:
  push:
    branches:
      - current-member-full-domain-audit-20260930
  workflow_dispatch:

jobs:
  spectroscopy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run guarded global gate and local principal spectroscopy
        run: python tools/run_ssz_spectroscopy_suite.py
      - name: Verify report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/generated/spectral/SSZ_SPECTROSCOPY_SUITE_REPORT.json").read_text())
          assert d["global_physical_spectroscopy_gate"]["status"] in {
            "PHYSICAL_GLOBAL_SPECTROSCOPY_READY",
            "PHYSICAL_GLOBAL_SPECTROSCOPY_BLOCKED",
          }
          assert d["local_principal_spectroscopy"]["status"] in {
            "LOCAL_PRINCIPAL_SPECTRAL_WEIGHT_REORDERING",
            "LOCAL_PRINCIPAL_SPECTRAL_WEIGHT_NULL",
            "LOCAL_PRINCIPAL_SPECTROSCOPY_CONTROL_FAIL",
          }
          print(json.dumps({
            "global":d["global_physical_spectroscopy_gate"],
            "local_status":d["local_principal_spectroscopy"]["status"],
            "any_rank_reordering":d["local_principal_spectroscopy"]["any_rank_reordering"],
            "controls":d["local_principal_spectroscopy"]["all_controls_pass"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssz-spectroscopy-suite
          path: data/generated/spectral/SSZ_SPECTROSCOPY_SUITE_REPORT.json
