name: Core action source schema probe

on:
  push:
    branches:
      - qnm-global-final-20261002
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pandas numpy
      - run: python tools/probe_core_action_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-action-source-schema-probe
          path: data/generated/qnm_global_diagnostic/CORE_ACTION_SOURCE_SCHEMA_PROBE.json
