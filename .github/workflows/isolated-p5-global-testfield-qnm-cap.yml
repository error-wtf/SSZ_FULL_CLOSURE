name: Isolated global P5 test-field QNM CAP scan

on:
  push:
    branches:
      - qnm-global-final-20261002
  workflow_dispatch:

jobs:
  p5-testfield-qnm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run center-to-exterior Maxwell/scalar CAP resonance scan
        run: python tools/run_p5_global_testfield_qnm_cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-global-testfield-qnm-cap
          path: data/generated/qnm/P5_GLOBAL_TESTFIELD_QNM_CAP.json
