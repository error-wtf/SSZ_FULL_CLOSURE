name: Current member Eq131 projected controllability

on:
  push:
    branches:
      - current-member-full-domain-audit-20260930
  workflow_dispatch:

jobs:
  controllability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Audit Eq131-compatible action tangent controllability
        run: python tools/audit_current_member_eq131_projected_controllability.py
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/generated/spectral/CURRENT_MEMBER_EQ131_PROJECTED_CONTROLLABILITY.json").read_text())
          assert d["diagnosis"] in {
            "EQ131_COMPATIBLE_LOCAL_TANGENT_EXISTS_TO_IMPROVE_ALL_TESTED_L",
            "PER_L_EQ131_COMPATIBLE_TANGENTS_EXIST_BUT_NO_COMMON_ALL_L_DIRECTION",
            "EQ131_CONSTRAINED_TANGENT_LOSES_KINETIC_CONTROLLABILITY",
          }
          print(json.dumps({
            "diagnosis":d["diagnosis"],
            "next_target":d["next_target"],
            "all_common":d["all_points_common_all_L_positive_direction"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-member-eq131-projected-controllability
          path: data/generated/spectral/CURRENT_MEMBER_EQ131_PROJECTED_CONTROLLABILITY.json
