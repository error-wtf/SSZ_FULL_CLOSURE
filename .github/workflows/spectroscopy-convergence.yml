name: Spectroscopy convergence and k-scan audit

on:
  workflow_dispatch:
  push:
    branches:
      - spectroscopy-finalization-20260930
    paths:
      - tools/audit_spectroscopy_convergence.py
      - .github/workflows/spectroscopy-convergence.yml

jobs:
  convergence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run spectroscopy convergence and local k scan
        run: python tools/audit_spectroscopy_convergence.py
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/generated/spectral/PRODUCTION_SPECTROSCOPY_CONVERGENCE_AUDIT.json").read_text())
          assert d["box"] and d["local_k_scan"]
          print(json.dumps(d["summary"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spectroscopy-convergence-audit
          path: data/generated/spectral/PRODUCTION_SPECTROSCOPY_CONVERGENCE_AUDIT.json
