name: Current member Eq131 boundary branch scan

on:
  push:
    branches:
      - current-member-full-domain-audit-20260930
  workflow_dispatch:

jobs:
  boundary-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Scan Eq131 boundary branches
        run: python tools/audit_current_member_eq131_boundary_branch.py
      - name: Verify artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/generated/spectral/CURRENT_MEMBER_EQ131_BOUNDARY_BRANCH_SCAN.json").read_text())
          assert d["diagnosis"] in {
            "EQ131_HAS_BOUNDARY_BRANCHES_WITH_HEALTHY_NEW_HIGH_L_TAIL",
            "EQ131_BOUNDARY_SCAN_DID_NOT_FIND_HEALTHY_NEW_HIGH_L_TAIL",
          }
          print(json.dumps({
            "diagnosis":d["diagnosis"],
            "next_target":d["next_target"],
            "healthy_highL_lambdas":d["healthy_highL_lambdas"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-member-eq131-boundary-branch-scan
          path: data/generated/spectral/CURRENT_MEMBER_EQ131_BOUNDARY_BRANCH_SCAN.json
