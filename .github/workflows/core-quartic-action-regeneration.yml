name: Core quartic action regeneration
on:
  push:
    branches: [qnm-global-final-20261002]
  workflow_dispatch:
jobs:
  core-regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: pip}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/regenerate_core_quartic_action41.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-quartic-action-regeneration
          path: |
            data/generated/qnm_global_diagnostic/CORE_QUARTIC_ACTION_REGEN_AUDIT.json
            data/generated/qnm_global_diagnostic/CORE_QUARTIC_ACTION_REGENERATED_41.csv
