name: Current member Eq131 finite continuation trial

on:
  push:
    branches:
      - current-member-full-domain-audit-20260930
  workflow_dispatch:

jobs:
  finite-continuation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run finite Eq131 predictor-corrector trial
        run: python tools/run_current_member_eq131_finite_continuation.py
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/generated/spectral/CURRENT_MEMBER_EQ131_FINITE_CONTINUATION_TRIAL.json").read_text())
          assert d["status"] in {
            "FINITE_EQ131_K_CONTINUATION_PASS",
            "FINITE_EQ131_K_CONTINUATION_IMPROVES_BUT_NOT_CLOSED",
            "FINITE_EQ131_K_CONTINUATION_STALLED",
          }
          assert d["production_action_max_abs_shift"] < 1e-14
          print(json.dumps({
            "status":d["status"],
            "next_target":d["next_target"],
            "initial":d["initial_worst"],
            "final":d["final_worst_full_active_rows"],
            "bg":d["background_max_abs_active_region"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-member-eq131-finite-continuation-trial
          path: data/generated/spectral/CURRENT_MEMBER_EQ131_FINITE_CONTINUATION_TRIAL.json
