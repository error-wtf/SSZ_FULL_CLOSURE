name: Regional alternative health audit

on:
  push:
    branches:
      - qnm-global-final-20261002
  workflow_dispatch:

jobs:
  alternatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/audit_regional_alternative_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-alternative-health-audit
          path: data/generated/qnm_global_diagnostic/REGIONAL_ALTERNATIVE_HEALTH_AUDIT.json
