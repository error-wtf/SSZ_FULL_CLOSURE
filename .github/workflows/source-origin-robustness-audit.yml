name: Source-origin robustness audit

on:
  push:
    branches:
      - current-member-full-domain-audit-20260930
  workflow_dispatch:

jobs:
  source-origin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run deep source-origin and stencil robustness audit
        run: python tools/audit_source_origin_robustness.py
      - name: Verify report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/generated/spectral/CURRENT_MEMBER_SOURCE_ORIGIN_ROBUSTNESS_AUDIT.json").read_text())
          assert d["diagnosis"] in {
              "TAIL_GHOST_EXISTS_IN_ARCHIVED_SELECTED_CENTRAL_41_STREAM",
              "TAIL_GHOST_INTRODUCED_BY_SOURCE_ACTION_REPLAY",
              "TAIL_GHOST_INTRODUCED_AFTER_SOURCE_REPLAY",
              "NO_TAIL_GHOST_REPRODUCED",
          }
          print(json.dumps({
              "diagnosis": d["diagnosis"],
              "earliest_tracked_stage": d["earliest_tracked_stage"],
              "tail_fail_flags_w9d8": d["tail_fail_flags_w9d8"],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-origin-robustness-audit
          path: data/generated/spectral/CURRENT_MEMBER_SOURCE_ORIGIN_ROBUSTNESS_AUDIT.json
