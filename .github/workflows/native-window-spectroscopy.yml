name: Native-window spectroscopy

on:
  push:
    branches:
      - current-member-full-domain-audit-20260930
  workflow_dispatch:

jobs:
  spectroscopy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Unit-test finite-box spectroscopy assembly
        run: python -m pytest -q tests/unit/test_native_window_spectroscopy.py
      - name: Run actual finite-window spectroscopy
        run: python tools/run_native_window_spectroscopy.py
      - name: Verify report and fail-closed global semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/generated/spectral/NATIVE_WINDOW_SPECTROSCOPY_REPORT.json")
          d=json.loads(p.read_text())
          assert d["finite_window_status"] in {
            "FINITE_WINDOW_SPECTROSCOPY_BULK_NOT_CONVERGED",
            "FINITE_WINDOW_BULK_RESIDUE_REORDERING_WITH_IR_BOUNDARY_SENSITIVITY",
            "FINITE_WINDOW_SPECTROSCOPY_IR_BOUNDARY_SENSITIVE",
            "FINITE_WINDOW_BULK_RESIDUE_REORDERING",
            "FINITE_WINDOW_SPECTRAL_SELECTION_NULL",
          }
          assert d["global_qnm_gate"]["status"] in {"BLOCKED","READY"}
          print(json.dumps({
            "finite_window_status":d["finite_window_status"],
            "global_qnm_gate":d["global_qnm_gate"],
            "per_L": {
              L: {
                "conv": x["omega2_resolution_max_relative_error"],
                "pairs": x["robust_inversion_pairs_common_to_both_resolutions"],
                "tachyon": x["finite_box_tachyon_present"],
              } for L,x in d["per_L"].items()
            },
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-window-spectroscopy
          path: |
            data/generated/spectral/NATIVE_WINDOW_SPECTROSCOPY_REPORT.json
            data/generated/spectral/native_window/*.npz
