name: Core Kscalar derivative convergence
on:
  push:
    branches: [qnm-global-final-20261002]
  workflow_dispatch:
jobs:
  kconv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: pip}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/audit_core_kscalar_derivative_convergence.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-kscalar-derivative-convergence
          path: data/generated/qnm_global_diagnostic/CORE_KSCALAR_DERIVATIVE_CONVERGENCE.json
