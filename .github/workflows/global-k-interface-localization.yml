name: Global K interface localization

on:
  push:
    branches:
      - qnm-global-final-20261002
  workflow_dispatch:

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Rebuild complete outer H+SVT direct 41
        run: python tools/build_outer_complete41_current.py
      - name: Localize global K and radial failure
        run: python tools/audit_global_k_interface_localization.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-k-interface-localization
          path: |
            data/generated/qnm_global_diagnostic/GLOBAL_K_INTERFACE_LOCALIZATION.json
            data/generated/qnm_global_diagnostic/GLOBAL_K_INTERFACE_LOCALIZATION.csv
            data/generated/qnm_global_diagnostic/OUTER_COMPLETE_H_SVT_41_AUDIT.json
