name: Core descriptor local spectrum
on:
  push:
    branches: [qnm-global-final-20261002]
  workflow_dispatch:
jobs:
  core-descriptor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: pip}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/audit_core_descriptor_local_spectrum.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-descriptor-local-spectrum
          path: data/generated/qnm_global_diagnostic/CORE_DESCRIPTOR_LOCAL_SPECTRUM.json
