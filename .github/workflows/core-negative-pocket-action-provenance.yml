name: Core negative-pocket action provenance
on:
  push:
    branches: [qnm-global-final-20261002]
  workflow_dispatch:
jobs:
  pocket:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: pip}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/audit_core_negative_pocket_action_provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-negative-pocket-action-provenance
          path: data/generated/qnm_global_diagnostic/CORE_NEGATIVE_POCKET_ACTION_PROVENANCE.json
