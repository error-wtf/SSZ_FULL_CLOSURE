name: Healthy local-k spectroscopy

on:
  workflow_dispatch:
  push:
    branches:
      - spectroscopy-finalization-20260930
    paths:
      - tools/run_healthy_local_k_spectroscopy.py
      - .github/workflows/healthy-local-k-spectroscopy.yml

jobs:
  local-k:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run healthy local-k spectroscopy
        run: python tools/run_healthy_local_k_spectroscopy.py
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/generated/spectral/HEALTHY_LOCAL_K_SPECTROSCOPY.json").read_text())
          assert d["summary"]["all_L_found_finite_all_positive_k"]
          print(json.dumps(d["summary"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: healthy-local-k-spectroscopy
          path: data/generated/spectral/HEALTHY_LOCAL_K_SPECTROSCOPY.json
