name: Imported-file integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_import.py
      - run: sha256sum -c IMPORT_SHA256SUMS
# This workflow verifies archival integrity and Python syntax, not physics closure.
